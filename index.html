<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pre Evičku ❤️</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
}

/* Fotka */
img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Tmavý překryv přes fotku */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.35);
}

/* Text */
h1 {
    
    position: relative;
    z-index: 2;
    margin: 0;
    padding: 20px;
    font-size: 48px;
    line-height: 1.4;
    text-align: center;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
    transform: translateY(100px);

}
</style>

</head>

<body>

<img src="foto.jpg" alt="Fotka">

<div class="overlay"></div>

<h1>
Evička ❤️<br>
všetko najlepšie k narodeninám<br><br>
Ďakujem, že si.
</h1>

</body>
</html>
